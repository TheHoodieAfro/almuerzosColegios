services:
  backend:
    build: ./backend
    container_name: almuerzos-backend
    expose:
      - "8000"
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: almuerzos-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
